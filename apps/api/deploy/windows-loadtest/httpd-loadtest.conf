# ============================================================================
# CharBook Library — Apache AISLADO para el entorno loadtest (Windows/XAMPP)
#
# Segunda instancia de Apache (no toca la configuración principal de XAMPP):
#   - escucha SOLO en 127.0.0.1:8001
#   - APP_ENV=loadtest → Laravel carga .env.loadtest (base charbook_loadtest)
#   - php.ini propio (deploy/windows-loadtest/php/php.ini) con opcache
#   - logs y PID en storage/app/private/loadtest/apache/ (ignorado por Git)
#
# Arrancar : C:\xampp\apache\bin\httpd.exe -f "C:\Projects\CharBook Library\apps\api\deploy\windows-loadtest\httpd-loadtest.conf"
# Detener  : C:\xampp\apache\bin\httpd.exe -f "C:\Projects\CharBook Library\apps\api\deploy\windows-loadtest\httpd-loadtest.conf" -k shutdown
# ============================================================================

ServerRoot "C:/xampp/apache"
ServerName 127.0.0.1:8001
Listen 127.0.0.1:8001

# mpm_winnt viene compilado en el httpd.exe de Apache Lounge (multihilo real).
# 32 hilos: concurrencia sobrada para 100 VUs sin comerse la RAM libre (~2 GB).
ThreadsPerChild 32
MaxConnectionsPerChild 0

# ── Módulos mínimos ──
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule rewrite_module modules/mod_rewrite.so

# ── PHP como módulo (build TS de XAMPP) con php.ini PROPIO (opcache on) ──
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/Projects/CharBook Library/apps/api/deploy/windows-loadtest/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

TypesConfig conf/mime.types

# ── Runtime aislado (PID + logs) ──
PidFile "C:/Projects/CharBook Library/apps/api/storage/app/private/loadtest/apache/httpd.pid"
ErrorLog "C:/Projects/CharBook Library/apps/api/storage/app/private/loadtest/apache/error.log"
LogFormat "%h %l %u %t \"%r\" %>s %b %Dus" loadtest
CustomLog "C:/Projects/CharBook Library/apps/api/storage/app/private/loadtest/apache/access.log" loadtest
LogLevel warn

# ── Sitio: SOLO la API Laravel, SOLO loopback ──
DocumentRoot "C:/Projects/CharBook Library/apps/api/public"
DirectoryIndex index.php

<Directory "C:/Projects/CharBook Library/apps/api/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require local
</Directory>

# Laravel detecta APP_ENV y carga .env.loadtest (charbook_loadtest, servicios
# externos deshabilitados). Guardas adicionales en charbook:loadtest-check.
SetEnv APP_ENV loadtest

# CRÍTICO en Windows: mod_php es MULTIHILO en un solo proceso y la carga de .env
# en runtime (Dotenv/putenv) NO es thread-safe → algunas peticiones booteaban sin
# entorno y caían al default sqlite. Con la config CACHEADA, Laravel no parsea
# .env por petición (thread-safe) y usa este archivo aislado (charbook_loadtest,
# generado con --env=loadtest). Ruta RELATIVA: Laravel la resuelve con basePath.
SetEnv APP_CONFIG_CACHE storage/app/private/loadtest/apache/config-loadtest.php

# Denegar todo lo que no sea el DocumentRoot.
<Directory />
    AllowOverride None
    Require all denied
</Directory>
